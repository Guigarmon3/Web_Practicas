<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"> <!--Css de los toast-->
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <input placeholder="Busqueda por nick" class="input_db" id="cli_found">
        <button class="button_db" id="cli_add">Añadir Cliente</button>
        <button class="button_db" id="cli_del">Borrar Cliente</button>
        <button class="button_db" id="cli_pendientes">Pagos pendientes</button> <!-- select * from cliente where id in (select id from cliente where is_made = false)-->
        <button class="button_db" id="cli_realizados">Pagos realizados</button>
    </header>
    
    <div id="main"> <!-- Aqui van los clientes -->
    </div>

    <footer>
        <H2>Gestión De Usuarios</H2>
    </footer>

<!-- Plantillas -->

<div id="template_table">
    <table>
        <tbody>
            <tr>
                <th>Tipo</th> <!--Tipo de trabajo, retrato, paisaje x-->
                <th>Titulo</th> <!--Descripcion del trabajo-->
                <th>id | Numero</th> <!--Id transaccion 6 caracteres-->
                <th>Fecha</th>
                <th>Precio USD$</th>
                <th>Precio PayPal</th> <!-- Realizar operaciones necesarias-->
                <th>Precio EUR€</th> <!-- Realizar operaciones necesarias-->
                <th>Transferencia Realizada</th> <!--Boolean-->
            </tr>
            <tr>
                <td>Retrato</td>
                <td>Realizar un retrato de el perro de Manolo Escobar</td>
                <td>971230</td>
                <td>2026-05-14</td>
                <td>8$</td>
                <td>7,30$</td>
                <td>6,86€</td>
                <td>true</td>
            </tr>
        </tbody>
    </table>
</div>

<div class="ventana" id="adduser">
    <h1>Añadir Cliente</h1>
    <form>
        <center>
        <input type="text" placeholder="(opcional) Nombre" id="add_nombre">
        <br>
        <input type="text" placeholder="NickName" id="add_nick" required>
        <br>
        <input type="email" placeholder="Email" id="add_email" required>
        <br>
        <input type="text" placeholder="Plataforma" id="add_plataforma" required>
        <br>
        <input type="submit" id="añadir" class="botonsend">
        </center>
    </form>
</div>

<div class="ventana" id="deluser">
    <h1>Añadir Cliente</h1>
    <form>
        <center>
            <input type="text" placeholder="Nombre del Cliente">
            <input type="number" placeholder="Id del cliente" min="0" required>
            <input type="submit" id="añadir" class="botonsend">
        </center>
    </form>
</div>

<!-- Scripts -->
        <script src="script.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/toastify-js" defer></script> <!--Api para los Toast-->
</body>
</html>
