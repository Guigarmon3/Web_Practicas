<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
        <link rel="stylesheet" href="./Css/style.css">
        <title>Gestión De Clientes</title>
    </head>
    <body>
        <header>
            <a href="./index.html" class="button_db white">Clientes</a>
            <a href="./Paginas/gestoria.html" class="button_db" id="gestoria">Registro Anual</a>
            <a href="./Paginas/cotizacion.html" class="button_db" id="cotizacion">TGSS</a>
            <a href="./Paginas/realizados.html" class="button_db" id="cli_pendientes">Realizados</a> 
            <a href="./Paginas/pendientes.html" class="button_db">Pendientes</a>
        </header>
        
        <div id="main">
            <div class="header-acciones">
                <input placeholder="Nickname" type="search" class="input_db" id="cli_found">
                <button class="button_db" id="cli_add">Añadir Cliente</button>
            </div>
            <div class="cliente cosas">
                <div class="cliente-cont titulos">
                    <h4>Nombre</h4>
                    <h4>Nickname</h4>
                    <h4>Email</h4>
                    <h4>Plataforma</h4>
                    <button class="test"></button>
                    <button class="test"></button>
                    <button class="test"></button>
                </div>
            </div>
            <div id="contenedor-clientes">

            </div>
        </div>

        <div class="ventana" id="adduser">
            <button class="xbutton_db" id="cerrar_add">X</button>
            <h1>Añadir Cliente</h1>
            <form>
                <center>
                    <input type="text" placeholder="(opcional) Nombre" id="add_nombre">
                    <br>
                    <input type="text" placeholder="NickName" id="add_nick" required>
                    <br>
                    <input type="email" placeholder="Email" id="add_email" required>
                    <br>
                    <input type="text" placeholder="Plataforma" id="add_plataforma" required>
                    <br>
                    <input type="submit" id="añadir" class="button_db" value="Añadir Cliente">
                </center>
            </form>
        </div>

        <div class="ventana" id="moduser">
            <button class="xbutton_db" id="cerrar_mod">X</button>
            <h1>Modificar Cliente</h1>
            <form>
                <center>
                    <input type="text" placeholder="(opcional) Nombre" id="mod_nombre">
                    <br>
                    <input type="text" placeholder="NickName" id="mod_nick" required>
                    <br>
                    <input type="email" placeholder="Email" id="mod_email" required>
                    <br>
                    <input type="text" placeholder="Plataforma" id="mod_plataforma" required>
                    <br>
                    <input type="submit" id="modificar" class="button_db" value="Modificar Cliente">
                </center>
            </form>
        </div>
        
        <div class="ventana" id="pagos"></div>

        <div class="ventana" id="addpago">
            <button class="xbutton_db" id="cerrar_addPago">X</button>
            <h1>Añadir Pago</h1>
            <form>
                <center>
                    <input type="text" placeholder="Tipo" id="add_tipo_pago" required>
                    <br>
                    <input type="text" placeholder="Titulo" id="add_titulo_pago" required>
                    <br>
                    <input type="date" placeholder="Fecha" id="add_fecha_pago" required>
                    <br>
                    <input type="number" step="0.01" placeholder="Precio USD$" id="add_precio_pago" required>
                    <br>
                    <input type="number" step="0.01" placeholder="Precio PayPal" id="add_precio_paypal" required>
                    <br>
                    <input type="number" step="0.01" placeholder="Precio EUR€" id="add_precio_eur" required>
                    <br>
                    <input type="submit" id="añadirPago" class="button_db" value="Añadir Pago">
                </center>
            </form>
        </div>

        <div class="ventana" id="modpago">
            <button class="xbutton_db" id="cerrar_modPago">X</button>
            <h1>Modificar Pago</h1>
            <form>
                <center>
                    <input type="text" placeholder="Tipo" id="mod_tipo_pago" required>
                    <br>
                    <input type="text" placeholder="Titulo" id="mod_titulo_pago" required>
                    <br>
                    <input type="date" placeholder="Fecha" id="mod_fecha_pago" required>
                    <br>
                    <input type="number" step="0.01" placeholder="Precio USD$" id="mod_precio_pago" required>
                    <br>
                    <input type="number" step="0.01" placeholder="Precio PayPal" id="mod_precio_paypal" required>
                    <br>
                    <input type="number" step="0.01" placeholder="Precio EUR€" id="mod_precio_eur" required>
                    <h4 class="modal-label">Transferencia:</h4>
                    <input type="checkbox" id="mod_transferencia">
                    <br>
                    <input type="submit" id="modificarPago" class="button_db" value="Modificar Pago">
                </center>
            </form>
        </div>

        <script src="./JavaScript/script.js" type="module"></script>
        <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    </body>
</html>
