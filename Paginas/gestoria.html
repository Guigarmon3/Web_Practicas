<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestoría</title>
    <link rel="stylesheet" href="../Css/style.css">
    <link rel="stylesheet" href="../Css/G.css">
</head>
<body>

    <header>
        <a href="../index.html" class="button_db">Clientes</a>
        <a href="./gestoria.html" class="button_db white" id="gestoria">Gestoría</a>
        <a href="./cotizacion.html" class="button_db" id="cotizacion">Cotización</a>
        <a href="./realizados.html" class="button_db" id="cli_pendientes">Realizados</a> 
        <a href="./pendientes.html" class="button_db">Pendientes</a>
    </header>

    <div id="main">
        <div class="header-acciones">
                <input type="number" step="0.01"id="quarterly" min="1" max="4" class="input_db" placeholder="Trimestre">
                <input type="number" step="0.01"id="year" min="2020" class="input_db" placeholder="Año">
                <button class="button_db" id="cotizacion_add">Registrar Gestoría</button>
            </div>
        <div id="contenedor-cotizaciones"></div>
    </div>

    <div id="modalPago" class="ventana" style="display: none;">
        <button class="xbutton_db" id="cerrarModalPago">X</button>
        <form id="formPago">
            <h3>Modificar Pago Hacienda</h3>
            <input type="hidden" id="pagoAnyo">
            <input type="hidden" id="pagoTrimestre">
            <input type="number" step="0.01" id="inputNuevoPago" class="input_db" style="width: 80%; height: 40px; display: block; margin: 0 auto;" placeholder="0.00" required>
            <button type="submit" class="button_db" style="margin-top: 20px; width: 80%; display: block; margin-left: auto; margin-right: auto;">Actualizar Pago</button>
        </form>
    </div>

    <script src="../JavaScript/G-script.js"></script>
</body>
</html>>
