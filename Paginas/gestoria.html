<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestoría</title>
        <link rel="stylesheet" href="../Css/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
        <link rel="stylesheet" href="../Css/cotizacion.css">
    </head>
    <body>

        <header>
            <a href="../index.html" class="button_db">Clientes</a>
            <a href="./gestoria.html" class="button_db white" id="gestoria">Registro Anual</a>
            <a href="./cotizacion.html" class="button_db" id="cotizacion">TGSS</a>
            <a href="./realizados.html" class="button_db" id="cli_pendientes">Realizados</a> 
            <a href="./pendientes.html" class="button_db">Pendientes</a>
        </header>

        <div id="main">
            <div class="header-acciones">
                    <input type="number" step="0.01" id="search_year" class="input_db" placeholder="Año">
                    <button class="button_db" id="gestoria_add">Registrar Año</button>
                </div>
            <div id="contenedor-gestoria"></div>
        </div>

        <div class="ventana" id="addgestion">
            <button class="xbutton_db" id="cerrar_add_gestion">X</button>
            <h1>Añadir Año</h1>
            <form id="formAddGestion">
                <h4>Año:</h4>
                <input type="number" id="add_year_gestion" required placeholder="Año">
                <button type="submit" id="add_gestion_button" class="button_db">Registrar Año</button>
            </form>
        </div>

        <div id="modgestion" class="ventana">
            <button class="xbutton_db" id="cerrarModgestion">X</button>
            <h1>Modificar Trimestre</h1>
            <form id="formPago">
                <h4>Rendimiento (€)</h4>
                <input type="number" step="0.01" id="mod_performance_gestion" required placeholder="Rendimiento (€)">
                <h4>Pago a Hacienda (€)</h4>
                <input type="number" step="0.01" id="mod_importe_gestion" required placeholder="Pago a Hacienda (€)">
                <button type="submit" id="mod_gestion_button" class="button_db">Actualizar Trimestre</button>
            </form>
        </div>

        <div id="meses" class="ventana">
            <button class="xbutton_db" id="cerrarMeses">X</button>
            <div id="meses-contenedor"></div>
        </div>

        <script src="../JavaScript/G-script.js" type="module"></script>
        <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    </body>
</html>
